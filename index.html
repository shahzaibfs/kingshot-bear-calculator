<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kingdom 2044 - BEAR HUNT CALCULATOR</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          Tahoma,
          Geneva,
          Verdana,
          sans-serif;
      }

      body {
        background: #0f172a;
        color: #fff;
        padding: 40px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        background: #1e293b;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
      }

      .card {
        background: #334155;
        padding: 15px;
        border-radius: 10px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        font-size: 18px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.25s;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result {
        margin-top: 30px;
      }

      .tb {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        margin-top: 15px;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #475569;
        padding: 12px;
        text-align: center;
      }

      th {
        background: #1d4ed8;
      }

      .remaining {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
        margin-top: 25px;
      }

      .remaining div {
        background: #334155;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }

      .note {
        margin-top: 20px;
        background: #0f172a;
        border-left: 4px solid #3b82f6;
        padding: 15px;
        border-radius: 8px;
        line-height: 1.6;
      }

      .error {
        border-left-color: #ef4444;
      }

      .success {
        border-left-color: #22c55e;
      }

      input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: #cbd5e1;
      }

      small.warning {
        color: #f87171;
        display: block;
        margin-top: 4px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="google_translate_element"></div>

      <h1>🏹 BEAR HUNT - By 2044 (TESTING PHASE)</h1>

      <div class="grid">
        <div class="card">
          <label>Total Archers</label>
          <input id="archers" type="number" value="180000" min="0" />
        </div>

        <div class="card">
          <label>Total Cavalry</label>
          <input id="cavalry" type="number" value="100000" min="0" />
        </div>

        <div class="card">
          <label>Total Infantry</label>
          <input id="infantry" type="number" value="100000" min="0" />
        </div>

        <div class="card">
          <label>Joiner March Size</label>
          <input
            id="marchSize"
            type="number"
            value="70000"
            min="70000"
            max="100000"
          />
        </div>

        <div class="card">
          <label>Priority Marches</label>
          <input id="priorityMarches" type="number" value="3" max="7" min="1" />
        </div>

        <div class="card">
          <label>
            Main Rally Leader
            <br />

            <ol style="padding-left: 20px">
              <li>80% Archers</li>
              <li>10% Cavalry</li>
              <li>10% Infantry</li>
              <li>Strong Archer Stats (400%+ is ideal)</li>
            </ol>

            <input id="mainLeader" type="checkbox" />
          </label>
        </div>

        <div class="card">
          <label>Leader March Size</label>

          <input
            id="leaderMarchSize"
            type="number"
            value="100000"
            min="100000"
            disabled
          />
        </div>
      </div>

      <button onclick="calculate()">Calculate</button>

      <div id="output" class="result"></div>
    </div>

    <script>
      const mainLeader = document.getElementById("mainLeader");
      const leaderMarchSize = document.getElementById("leaderMarchSize");
      const output = document.getElementById("output");

      const LEADER_PERCENTAGES = {
        ARCHERS: 0.8,
        CAVALRY: 0.1,
        INFANTRY: 0.1,
      };

      const IDEAL_JOINER_PERCENTAGES = {
        ARCHERS: 0.58,
        CAVALRY: 0.42,
        INFANTRY: 0,
      };

      const FIXED_JOINER_PERCENTAGES = {
        ARCHERS: 0.65,
        CAVALRY: 0.35,
        INFANTRY: 0,
      };

      const IDEAL_MARCH_SIZE = 65000;

      const MIN_ARCHER_PERCENTAGE = IDEAL_JOINER_PERCENTAGES.ARCHERS * 100;

      function getNumber(id, fallback = 0) {
        const value = Number(document.getElementById(id).value);

        if (!Number.isFinite(value) || value < 0) {
          return fallback;
        }

        return Math.floor(value);
      }

      function toggleLeaderMarchSize() {
        leaderMarchSize.disabled = !mainLeader.checked;
      }

      function createComposition(size, percentages) {
        const archers = Math.floor(size * percentages.ARCHERS);
        const cavalry = Math.floor(size * percentages.CAVALRY);
        const infantry = size - archers - cavalry;

        return {
          archers,
          cavalry,
          infantry,
          total: size,
        };
      }

      function buildJoinerMarches({
        marchSize,
        archersAvailable,
        cavalryAvailable,
        infantaryAvailiable,
        marchCount,
      }) {
        if (marchCount <= 0) {
          return {
            valid: true,
            marches: [],
            totalArchers: 0,
            totalCavalry: 0,
            totalInfantry: 0,
          };
        }

        const idealArchers = Math.floor(
          marchSize * IDEAL_JOINER_PERCENTAGES.ARCHERS,
        );

        const maxArchers = Math.floor(
          marchSize * FIXED_JOINER_PERCENTAGES.ARCHERS,
        );

        const fixedInfantry = Math.floor(
          marchSize * IDEAL_JOINER_PERCENTAGES.INFANTRY,
        );

        const requiredArchers = idealArchers * marchCount;
        const requiredInfantry = fixedInfantry * marchCount;

        if (archersAvailable < requiredArchers) {
          return {
            valid: false,
            reason: "ARCHER_MINIMUM",
            marches: [],
            requiredArchers,
            availableArchers: archersAvailable,
            totalArchers: 0,
            totalCavalry: 0,
            totalInfantry: 0,
          };
        }

        if (infantaryAvailiable < requiredInfantry) {
          return {
            valid: false,
            reason: "INFANTRY_MINIMUM",
            marches: [],
            requiredInfantry,
            availableInfantry: infantaryAvailiable,
            totalArchers: 0,
            totalCavalry: 0,
            totalInfantry: 0,
          };
        }

        const maxTotalArchers = maxArchers * marchCount;

        const extraArchersAvailable = Math.max(
          0,
          archersAvailable - requiredArchers,
        );

        const extraArcherCapacity = maxTotalArchers - requiredArchers;

        const extraArchers = Math.min(
          extraArchersAvailable,
          extraArcherCapacity,
        );

        const totalArchers = requiredArchers + extraArchers;

        const totalInfantry = fixedInfantry * marchCount;

        const totalCapacity = marchSize * marchCount;

        const totalCavalry = Math.min(
          cavalryAvailable,
          totalCapacity - totalArchers - totalInfantry,
        );

        function distribute(total, count) {
          const base = Math.floor(total / count);
          const remainder = total % count;

          return Array.from(
            { length: count },
            (_, index) => base + (index < remainder ? 1 : 0),
          );
        }

        const archersPerMarch = distribute(totalArchers, marchCount);

        const infantryPerMarch = Array(marchCount).fill(fixedInfantry);

        const cavalryPerMarch = distribute(totalCavalry, marchCount);

        const marches = [];

        for (let i = 0; i < marchCount; i++) {
          const archers = archersPerMarch[i];
          const cavalry = cavalryPerMarch[i];
          const infantry = infantryPerMarch[i];

          const total = archers + cavalry + infantry;

          marches.push({
            number: i + 1,
            archers,
            cavalry,
            infantry,
            total,
            missing: Math.max(0, marchSize - total),
            valid:
              archers >= idealArchers &&
              archers <= maxArchers &&
              infantry === fixedInfantry &&
              total <= marchSize,
          });
        }

        return {
          valid: marches.every((march) => march.valid),

          marches,

          totalArchers: marches.reduce((sum, march) => sum + march.archers, 0),

          totalCavalry: marches.reduce((sum, march) => sum + march.cavalry, 0),

          totalInfantry: marches.reduce(
            (sum, march) => sum + march.infantry,
            0,
          ),

          minimumArchers: idealArchers,
          maximumArchers: maxArchers,
          fixedInfantry,

          requiredArchers,
          requiredInfantry,

          availableArchers: archersAvailable,
          availableCavalry: cavalryAvailable,
          availableInfantry: infantaryAvailiable,
        };
      }
      function validateFinalMarches(marches, marchSize) {
        const errors = [];

        const minimumArchers = Math.ceil(
          marchSize * IDEAL_JOINER_PERCENTAGES.ARCHERS,
        );

        const minimumInfantry = Math.ceil(
          marchSize * IDEAL_JOINER_PERCENTAGES.INFANTRY,
        );

        const maximumInfantry = Math.floor(
          marchSize * FIXED_JOINER_PERCENTAGES.INFANTRY,
        );

        marches.forEach((march) => {
          if (march.archers < minimumArchers) {
            errors.push(
              `March ${march.number}: Archer is below ${MIN_ARCHER_PERCENTAGE}%`,
            );
          }

          if (march.infantry < minimumInfantry) {
            errors.push(
              `March ${march.number}: Infantry is below ${
                IDEAL_JOINER_PERCENTAGES.INFANTRY * 100
              }%`,
            );
          }

          if (march.infantry > maximumInfantry) {
            errors.push(
              `March ${march.number}: Infantry exceeds ${
                FIXED_JOINER_PERCENTAGES.INFANTRY * 100
              }%`,
            );
          }

          if (march.total < marchSize) {
            errors.push(
              `March ${march.number}: missing ${(
                marchSize - march.total
              ).toLocaleString()} troops`,
            );
          }

          if (march.archers < 0) {
            errors.push(`March ${march.number}: invalid Archer count`);
          }

          if (march.cavalry < 0) {
            errors.push(`March ${march.number}: invalid Cavalry count`);
          }

          if (march.infantry < 0) {
            errors.push(`March ${march.number}: invalid Infantry count`);
          }
        });

        return {
          valid: errors.length === 0,
          errors,
        };
      }

      function calculate(validationOnly = true) {
        let A = getNumber("archers");
        let C = getNumber("cavalry");
        let I = getNumber("infantry");

        const MARCH_SIZE =
          getNumber("marchSize", IDEAL_MARCH_SIZE) || IDEAL_MARCH_SIZE;

        const PRIORITY = Math.max(
          1,
          Math.min(7, getNumber("priorityMarches", 3)),
        );

        const MAIN_LEADER = mainLeader.checked;

        const LEADER_MARCH_SIZE =
          getNumber("leaderMarchSize", 100000) || 100000;

        const marches = [];

        if (MAIN_LEADER) {
          const leader = createComposition(
            LEADER_MARCH_SIZE,
            LEADER_PERCENTAGES,
          );

          const leaderErrors = [];

          if (A < leader.archers) {
            leaderErrors.push(
              `🏹 Archers: need ${(leader.archers - A).toLocaleString()} more`,
            );
          }

          if (C < leader.cavalry) {
            leaderErrors.push(
              `🐎 Cavalry: need ${(leader.cavalry - C).toLocaleString()} more`,
            );
          }

          if (I < leader.infantry) {
            leaderErrors.push(
              `🛡 Infantry: need ${(
                leader.infantry - I
              ).toLocaleString()} more`,
            );
          }

          if (leaderErrors.length && validationOnly) {
            alert(
              `⚠️ Not enough troops for Main Rally Leader.\n\n${leaderErrors.join(
                "\n",
              )}`,
            );
          }

          marches.push({
            number: "👑 Leader",
            archers: leader.archers,
            cavalry: leader.cavalry,
            infantry: leader.infantry,
            total: leader.total,
            leader: true,
          });

          A -= leader.archers;
          C -= leader.cavalry;
          I -= leader.infantry;

          A = Math.max(0, A);
          C = Math.max(0, C);
          I = Math.max(0, I);
        }

        const joinerMarches = MAIN_LEADER
          ? Math.max(0, PRIORITY - 1)
          : PRIORITY;

        if (joinerMarches > 0) {
          const joinerResult = buildJoinerMarches({
            marchSize: MARCH_SIZE,
            archersAvailable: A,
            cavalryAvailable: C,
            infantaryAvailiable: I,
            marchCount: joinerMarches,
          });

          if (
            !joinerResult.marches ||
            joinerResult.marches.length !== joinerMarches
          ) {
            let message = "⚠️ Formation cannot be completed.\n\n";

            if (joinerResult.reason === "ARCHER_MINIMUM") {
              message +=
                `🏹 Required Archers: ${(
                  joinerResult.requiredArchers || 0
                ).toLocaleString()}\n` +
                `🏹 Available Archers: ${(
                  joinerResult.availableArchers || 0
                ).toLocaleString()}`;
            }

            if (joinerResult.reason === "INFANTRY_MINIMUM") {
              message +=
                `🛡 Required Infantry: ${(
                  joinerResult.requiredInfantry || 0
                ).toLocaleString()}\n` +
                `🛡 Available Infantry: ${(
                  joinerResult.availableInfantry || 0
                ).toLocaleString()}`;
            }

            if (validationOnly) {
              alert(message);
            }

            output.innerHTML = `
              <div class="note error">
                <strong>⚠️ Formation cannot be completed.</strong>
                <br><br>
                ${message.replace(/\n/g, "<br>")}
              </div>
            `;

            return false;
          }

          joinerResult.marches.forEach((march, index) => {
            const marchNumber = MAIN_LEADER ? index + 2 : index + 1;

            marches.push({
              number: marchNumber,
              archers: Number(march.archers) || 0,
              cavalry: Number(march.cavalry) || 0,
              infantry: Number(march.infantry) || 0,
              total: Number(march.total) || 0,
              missing: Number(march.missing) || 0,
              leader: false,
              valid: Boolean(march.valid),
            });
          });

          A -= Number(joinerResult.totalArchers) || 0;
          C -= Number(joinerResult.totalCavalry) || 0;
          I -= Number(joinerResult.totalInfantry) || 0;

          A = Math.max(0, A);
          C = Math.max(0, C);
          I = Math.max(0, I);
        }

        const joinerResults = marches.filter((march) => !march.leader);

        const validation = validateFinalMarches(joinerResults, MARCH_SIZE);

        const incompleteMarches = marches.filter((march) => {
          const requiredSize = march.leader ? LEADER_MARCH_SIZE : MARCH_SIZE;

          return march.total < requiredSize;
        });

        if (incompleteMarches.length) {
          validation.valid = false;

          incompleteMarches.forEach((march) => {
            const requiredSize = march.leader ? LEADER_MARCH_SIZE : MARCH_SIZE;

            const missing = requiredSize - march.total;

            if (missing > 0) {
              validation.errors.push(
                `March ${march.number}: missing ${missing.toLocaleString()} troops`,
              );
            }
          });
        }

        let html = `
          <h2>
            Priority Marches: ${PRIORITY}
          </h2>

          <div class="tb">
            <table>
              <tr>
                <th>March</th>
                <th>🏹 Archers</th>
                <th>🐎 Cavalry</th>
                <th>🛡 Infantry</th>
                <th>Total</th>
                <th>Ratio</th>
              </tr>
        `;

        marches.forEach((march) => {
          const requiredSize = march.leader ? LEADER_MARCH_SIZE : MARCH_SIZE;

          const isComplete = march.total >= requiredSize;

          const rowStyle = march.leader
            ? `style="background:#14532d;font-weight:bold;"`
            : "";

          const archerPercentage =
            march.total > 0
              ? ((march.archers / march.total) * 100).toFixed(1)
              : 0;

          const cavalryPercentage =
            march.total > 0
              ? ((march.cavalry / march.total) * 100).toFixed(1)
              : 0;

          const infantryPercentage =
            march.total > 0
              ? ((march.infantry / march.total) * 100).toFixed(1)
              : 0;

          let status = "";

          if (!isComplete) {
            status = `
              <small class="warning">
                ⚠️ Missing ${(requiredSize - march.total).toLocaleString()}
              </small>
            `;
          }

          html += `
            <tr ${rowStyle}>
              <td>
                <b>${march.number}</b>
              </td>

              <td>
                ${march.archers.toLocaleString()}
              </td>

              <td>
                ${march.cavalry.toLocaleString()}
              </td>

              <td>
                ${march.infantry.toLocaleString()}
              </td>

              <td>
                ${march.total.toLocaleString()}
                ${status}
              </td>

              <td>
                🏹 ${archerPercentage}%<br>
                🐎 ${cavalryPercentage}%<br>
                🛡 ${infantryPercentage}%
              </td>
            </tr>
          `;
        });

        html += `
            </table>
          </div>

          <div class="remaining">
            <div>
              <h3>🏹 Remaining Archers</h3>
              <h2>${A.toLocaleString()}</h2>
            </div>

            <div>
              <h3>🐎 Remaining Cavalry</h3>
              <h2>${C.toLocaleString()}</h2>
            </div>

            <div>
              <h3>🛡 Remaining Infantry</h3>
              <h2>${I.toLocaleString()}</h2>
            </div>
          </div>
        `;

        if ((C > 0 || A > 0 || I > 0) && !MAIN_LEADER) {
          const suggestionRally = createComposition(
            LEADER_MARCH_SIZE,
            LEADER_PERCENTAGES,
          );

          const rallyArchers = Math.min(A, suggestionRally.archers);

          const rallyInfantry = Math.min(I, suggestionRally.infantry);

          const remainingSpace =
            LEADER_MARCH_SIZE - rallyArchers - rallyInfantry;

          const rallyCavalry = Math.min(C, Math.max(0, remainingSpace));

          const rallyTotal = rallyArchers + rallyCavalry + rallyInfantry;

          html += `
            <div class="note success">
              <strong>✅ Suggestion for Rally Host</strong><br>
              🏹 Archers: ${rallyArchers.toLocaleString()}<br>
              🐎 Cavalry: ${rallyCavalry.toLocaleString()}<br>
              🛡 Infantry: ${rallyInfantry.toLocaleString()}<br>
              <strong>Total: ${rallyTotal.toLocaleString()}</strong>
            </div>
          `;
        }

        if (validation.valid) {
          html += `
            <div class="note success">
              <strong>
                ✅ All priority marches are valid.
              </strong>
            </div>
          `;
        } else {
          html += `
            <div class="note error">
              <strong>
                ⚠️ Formation cannot be completed.
              </strong>

              <br><br>

              ${[...new Set(validation.errors)].join("<br>")}
            </div>
          `;
        }

        output.innerHTML = html;

        return validation.valid;
      }

      mainLeader.addEventListener("change", () => {
        toggleLeaderMarchSize();
        calculate();
      });

      toggleLeaderMarchSize();
      calculate();
    </script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
          },
          "google_translate_element",
        );
      }
    </script>

    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </body>
</html>
